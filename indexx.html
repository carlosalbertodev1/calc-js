<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Básica</title>
</head>
<body>

  

    
    <script>
    let n1, n2 ,n3;
    let mat;
    n1 = prompt("nota1: ")
    n2 = prompt("nota2: ")
    n3 = prompt("nota3: ")
    
    mat = (parseFloat(n1)+parseFloat(n2)+parseFloat(n3))/3;


    if (mat >= 8)
    {
        alert("Aprovado");
    
    }
    else if(mat == 7 )
    {
            alert("ficou na média");
            
    }
    else(mat <= 6)
    
    {
        alert("ficou reprovado");
        
    }
    
    
    </script>

</body>
</html>
